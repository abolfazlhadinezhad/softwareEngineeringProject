name: ${COMPOSE_PROJECT_NAME:-bnut-production}

x-app: &app
  build: ./backend
  env_file: .env.production
  environment:
    DJANGO_DEBUG: 'false'
    MYSQL_HOST: db
    MYSQL_PORT: 3306
    REDIS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    TRUST_PROXY_TLS: 'true'
  volumes:
    - private_media:/app/private-media
    - static_files:/app/staticfiles
  networks: [private]
  restart: unless-stopped
  init: true
  stop_grace_period: 40s

services:
  db:
    image: mysql:8.0
    env_file: .env.production
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes: [mysql_data:/var/lib/mysql]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
  migrate:
    <<: *app
    restart: 'no'
    command: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput'
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/api/v1/health/live/', headers={'X-Forwarded-Proto':'https'}), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  celery-worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  celery-beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: {context: ./frontend, target: production}
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 10
  nginx:
    image: nginx:stable-alpine
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY to an approved certificate directory}:/etc/nginx/tls:ro
      - static_files:/srv/static:ro
    networks: [private, edge]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}

volumes:
  mysql_data:
  redis_data:
  private_media:
  static_files:
networks:
  private: {internal: true}
  edge:
